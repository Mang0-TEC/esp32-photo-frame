; ══════════════════════════════════════════════════════════════════════
;  BANCO DE PRUEBAS — NO ES LA BASE DEL FIRMWARE REAL
;
;  El firmware del marco vive en ../platformio.ini, env:marco, con sus
;  siete dependencias. Aquí viven CUATRO bancos, uno por cosa que se mide:
;
;    env:mock     la capa de red de web/index.html contra el ESP32 real,
;                 sin display, sin SD y sin sensor. No usa ningún GPIO.
;    env:led      LedRGB contra el LED real (GPIOs 25, 33, 4).
;    env:wifi     el provisioning de WiFiManager, pendiente #5. ETAPA 1.
;    env:display  el display y el BH1750 — pendientes #1, #3 y #4.
;
;  Las CINCO versiones de abajo son COPIA MANUAL de ../platformio.ini y se
;  sincronizan A MANO cuando aquél cambie. Si divergen, el banco deja de
;  probar lo que el firmware va a correr — que es el único motivo de que
;  estos mocks estén en el ESP32 y no en Python.
;
;  La ÚNICA excepción son los flags de TFT_eSPI, que no se copian: entran por
;  extra_configs desde ../tft_comun.ini. Ahí está escrito por qué ése sí y las
;  versiones no — resumen: una versión divergente es detectable, un pin
;  divergente hace que el banco pruebe otro circuito en silencio.
; ══════════════════════════════════════════════════════════════════════

[platformio]
data_dir      = ../../web     ; uploadfs sirve web/index.html sin copiarlo
default_envs  = mock          ; sin esto `pio run` compilaría los cuatro
extra_configs = ../tft_comun.ini   ; los flags de TFT_eSPI, para env:display

[env:mock]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32dev          ; sin esta línea: TypeError en setup_python_env
framework = arduino

monitor_speed = 115200
; SIN upload_port/monitor_port A PROPOSITO: asi PlatformIO autodetecta.
; El sufijo del tty es el LOCATION ID DEL USB (`USB Serial@01120000` ->
; wchusbserial1120), o sea que cambia al mover el cable de puerto o de hub y NO
; identifica a la placa. Un valor literal obliga a editar cinco bloques cada vez
; que se reenchufa, y eso ya paso.
;
; MEDIDO el 7-ago-2026, y el mecanismo NO es el que parece: un comodin tampoco
; sirve, pero no porque PlatformIO no sepa expandirlo —su AutodetectUploadPort()
; lo hace (builder/tools/pioupload.py:99)— sino porque el platform de Espressif
; solo LLAMA a esa funcion si el puerto esta vacio:
;     if not env.subst("$UPLOAD_PORT"): env.AutodetectUploadPort()
;         (espressif32/builder/main.py:157)
; Con cualquier valor puesto se lo pasa literal a esptool, que falla con
; «could not open». Dejarlo vacio es la unica via.
;
; Si alguna vez hay dos puentes USB-serie conectados a la vez, PlatformIO elige
; el ultimo con VID:PID y puede acertar el equivocado: ahi se usa
; `pio run -t upload --upload-port /dev/cu.wchusbserialNNNN` para esa corrida.

; Sin este filtro, el banco de red arrastraría los otros dos sketches y tendría
; tres setup(). El aviso de sincronización manual de arriba aplica a este env
; (las dos async) y a env:wifi (WiFiManager); env:led no duplica ninguna versión
; porque no usa ninguna librería.
build_src_filter = +<banco.cpp>

board_build.filesystem = littlefs
; sin board_build.partitions: default.csv da 1.2 MB de app y ~1.5 MB de
; filesystem. huge_app.csv es de producción y aquí no hace falta.

lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

build_flags =
    ; nombreValido() vive en ../src/nombre.h, compartida con el marco y con el
    ; banco del display. No es copia manual a propósito: ver ese archivo.
    -I../src
    ; Los dos buffers salen de un malloc de arranque, no de .bss: el enlazador
    ; solo da 74,392 B de dram0_0_seg y hacen falta 114,688. Un malloc único que
    ; nunca se libera ni se redimensiona tampoco fragmenta, que era el punto.
    ; Son flags y no constantes del .cpp para repetir la Fase 0 sin editar nada.
    -D BANCO_TOPE=65536            ; tope duro por archivo → 413. NO subirlo.
    -D BANCO_RET=49152             ; foto retenida que sirve /photo. NO se
                                   ; dimensiona contra el peor caso del pipeline
                                   ; —40.3, 43.0, 50.7 KB: sube en cada tanda y no
                                   ; es una cota— sino contra el HEAP, que es lo
                                   ; que de verdad lo limita. Medido: con 65536
                                   ; aquí, mayorBloque cae de 34804 a 16372 tras
                                   ; WiFi, y AsyncTCP pide memoria por conexión.
                                   ; Una foto mayor sube bien y se verifica como
                                   ; «no retenida», que NO es corrupción.
    -D BANCO_RETARDO_SD_MS=30
;   -D BANCO_CORS      ; ¡¡SOLO con la página servida desde otra máquina!!

; ══════════════════════════════════════════════════════════════════════
;  BANCO DEL LED — sí usa GPIOs, al revés que env:mock
;
;  Verifica LedRGB contra el LED real: pinout, corriente por canal, si el
;  fade se ve lineal, y los ritmos de cada estado de §9. Compila
;  ../src/LedRGB.cpp EN SU SITIO, sin copiarlo: el banco tiene que probar
;  el mismo archivo que va a correr en el marco, que es la única razón de
;  que estos mocks estén en el ESP32 y no en Python.
;
;  No lleva lib_deps: el LED no necesita ninguna de las siete.
; ══════════════════════════════════════════════════════════════════════
[env:led]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32dev
framework = arduino

monitor_speed = 115200
; SIN upload_port/monitor_port A PROPOSITO: asi PlatformIO autodetecta.
; El sufijo del tty es el LOCATION ID DEL USB (`USB Serial@01120000` ->
; wchusbserial1120), o sea que cambia al mover el cable de puerto o de hub y NO
; identifica a la placa. Un valor literal obliga a editar cinco bloques cada vez
; que se reenchufa, y eso ya paso.
;
; MEDIDO el 7-ago-2026, y el mecanismo NO es el que parece: un comodin tampoco
; sirve, pero no porque PlatformIO no sepa expandirlo —su AutodetectUploadPort()
; lo hace (builder/tools/pioupload.py:99)— sino porque el platform de Espressif
; solo LLAMA a esa funcion si el puerto esta vacio:
;     if not env.subst("$UPLOAD_PORT"): env.AutodetectUploadPort()
;         (espressif32/builder/main.py:157)
; Con cualquier valor puesto se lo pasa literal a esptool, que falla con
; «could not open». Dejarlo vacio es la unica via.
;
; Si alguna vez hay dos puentes USB-serie conectados a la vez, PlatformIO elige
; el ultimo con VID:PID y puede acertar el equivocado: ahi se usa
; `pio run -t upload --upload-port /dev/cu.wchusbserialNNNN` para esa corrida.

build_src_filter = +<led.cpp> +<../../src/LedRGB.cpp>
build_flags      = -I../src

; El `..` del filtro deja el objeto en .pio/build/src/LedRGB.cpp.o, un nivel
; ARRIBA del directorio de este env, así que `-t clean` no lo borra. SCons decide
; por hash de contenido y no por fecha, o sea que editar LedRGB.cpp SÍ recompila
; (un `touch` a secas no, y es lo correcto).
;
; «Si algún día otro env compila también de ahí, los dos objetos colisionan en
; esa ruta compartida» — ya pasó: env:wifi hace lo mismo. La firma de SCons
; incluye los flags, y los de los dos envs difieren (WiFiManager arrastra sus
; includes), así que alternar entre `-e led` y `-e wifi` RECOMPILA ese archivo.
; Es un recompilado de un segundo, no un objeto viejo colándose: se acepta.


; ══════════════════════════════════════════════════════════════════════
;  BANCO DEL PROVISIONING — pendiente #5, ETAPA 1
;
;  WiFiManager@2.0.17 sobre arduino-esp32 3.3.11 es la combinación exacta
;  del issue #1797 de tzapu («Guru Meditation Error: Core 1 panic'ed» al
;  levantar el portal). Es la única dependencia capaz de forzar un cambio
;  de plataforma, así que se prueba antes que ningún otro hardware.
;
;  Aquí corre SOLO WiFiManager + LedRGB. La ETAPA 2 —la vecindad real de
;  setup(), con los cinco globales y tft.begin()/SD.begin() ya corridos—
;  NO está en el banco: es ../platformio.ini env:marco tal cual. Partirlo
;  así es lo que separa «es la librería» de «es la presión de heap», que
;  tienen planes B distintos.
;
;  Plan B si panica en las dos etapas, por costo (BOM, pendiente #5):
;    lib_deps = https://github.com/tzapu/WiFiManager.git#master
;  y reflashear este mismo env.
; ══════════════════════════════════════════════════════════════════════
[env:wifi]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32dev
framework = arduino

monitor_speed = 115200
; SIN upload_port/monitor_port A PROPOSITO: asi PlatformIO autodetecta.
; El sufijo del tty es el LOCATION ID DEL USB (`USB Serial@01120000` ->
; wchusbserial1120), o sea que cambia al mover el cable de puerto o de hub y NO
; identifica a la placa. Un valor literal obliga a editar cinco bloques cada vez
; que se reenchufa, y eso ya paso.
;
; MEDIDO el 7-ago-2026, y el mecanismo NO es el que parece: un comodin tampoco
; sirve, pero no porque PlatformIO no sepa expandirlo —su AutodetectUploadPort()
; lo hace (builder/tools/pioupload.py:99)— sino porque el platform de Espressif
; solo LLAMA a esa funcion si el puerto esta vacio:
;     if not env.subst("$UPLOAD_PORT"): env.AutodetectUploadPort()
;         (espressif32/builder/main.py:157)
; Con cualquier valor puesto se lo pasa literal a esptool, que falla con
; «could not open». Dejarlo vacio es la unica via.
;
; Si alguna vez hay dos puentes USB-serie conectados a la vez, PlatformIO elige
; el ultimo con VID:PID y puede acertar el equivocado: ahi se usa
; `pio run -t upload --upload-port /dev/cu.wchusbserialNNNN` para esa corrida.

; Convierte el backtrace de direcciones del Guru Meditation en archivo:línea.
; Sin esto, el entregable de esta prueba —«en qué línea panicó»— no existe.
monitor_filters = esp32_exception_decoder

; COPIA MANUAL de ../platformio.ini. Ver el aviso del encabezado.
lib_deps = tzapu/WiFiManager@2.0.17

; LedRGB compilado EN SU SITIO, igual que env:led y por la misma razón: el LED
; es hoy el único canal de salida del marco y tiene que ser el mismo archivo.
build_src_filter = +<wifi.cpp> +<../../src/LedRGB.cpp>

; El -I../src sirve para dos cosas: LedRGB.h y wm_strings_marco.h, que es el
; portal en español. Va por flag y NUNCA editando la librería, igual que
; USER_SETUP_LOADED con TFT_eSPI. COPIA MANUAL de ../platformio.ini.
build_flags =
    -I../src
    -D WM_STRINGS_FILE='"wm_strings_marco.h"'


; ══════════════════════════════════════════════════════════════════════
;  BANCO DEL DISPLAY Y LA SD — pendientes #1, #3, #4, y la coexistencia
;
;  Compila src/display.cpp, que responde tres cosas que no se deciden desde
;  el escritorio: si el pin BL es entrada lógica o cátodo crudo (#1), la
;  velocidad SPI máxima estable (#3) y la dirección I2C del BH1750 (#4).
;
;  ── Por qué la SD entra AQUÍ y no en un env:sd ────────────────────────
;
;  Porque lo que hay que probar no es que SD.begin() monte la tarjeta —eso no
;  informa de nada— sino que el display en VSPI y la SD en HSPI no se pisen
;  bajo carga sostenida, que es el issue #3601 de TFT_eSPI y la razón de los
;  dos buses separados. Un env:sd tendría que traer TFT_eSPI, los flags
;  compartidos, tft.begin(), rotación y backlight para poder probarlo: sería
;  este env copiado. Y la línea base contra la que se compara —62.3 ms por
;  pantalla y 77 ms en bloques de 16x16— la midió cronometrar() en ESTE
;  binario, así que quedándose aquí el «con SD» y el «sin SD» son el mismo
;  build y la comparación no gana una variable libre.
;
;  No añade riesgo estructural: SD.h y SPI.h vienen del framework, no de
;  lib_deps, o sea que no hay una versión más que sincronizar a mano.
;
;  ── El barrido de SPI son TRES BINARIOS, no una tecla ─────────────────
;
;  SPI_FREQUENCY entra en el SPISettings de cada beginTransaction
;  (TFT_eSPI.cpp:78, 90 y 167), o sea que es macro de compilación y no tiene
;  setter en caliente. Y aunque lo tuviera, probaría lo que no es: la
;  secuencia de init del ST7796S corre a esa misma frecuencia, así que
;  subirla después de arrancar NO reproduce lo que hace producción al
;  encender. Se edita el flag de abajo y se reflashea: 27 → 40 → 80 MHz.
;
;  Por eso lo primero que imprime el arranque es la frecuencia compilada:
;  van a existir tres binarios casi idénticos y hay que saber cuál está en
;  la placa.
;
;  ── El backlight puede no depender de este env ────────────────────────
;
;  Si la prueba de tres pasos del BOM da Caso A (cátodo crudo), GPIO19 NO
;  puede manejar el backlight sin el PN2222A: son ~140 mA contra los 40 mA
;  de máximo absoluto del pin. En ese caso se ata BL a GND de forma
;  permanente para el barrido de SPI —backlight siempre encendido, GPIO19 al
;  aire— y el pendiente #3 no espera al transistor. Las teclas de brillo
;  quedan muertas; display.cpp lo dice al arrancar.
;
;  Sin board_build.partitions ni filesystem, igual que env:led y env:wifi:
;  default.csv da 1.2 MB de app y sobra de largo.
; ══════════════════════════════════════════════════════════════════════
[env:display]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32dev
framework = arduino

monitor_speed = 115200
; SIN upload_port/monitor_port A PROPOSITO: asi PlatformIO autodetecta.
; El sufijo del tty es el LOCATION ID DEL USB (`USB Serial@01120000` ->
; wchusbserial1120), o sea que cambia al mover el cable de puerto o de hub y NO
; identifica a la placa. Un valor literal obliga a editar cinco bloques cada vez
; que se reenchufa, y eso ya paso.
;
; MEDIDO el 7-ago-2026, y el mecanismo NO es el que parece: un comodin tampoco
; sirve, pero no porque PlatformIO no sepa expandirlo —su AutodetectUploadPort()
; lo hace (builder/tools/pioupload.py:99)— sino porque el platform de Espressif
; solo LLAMA a esa funcion si el puerto esta vacio:
;     if not env.subst("$UPLOAD_PORT"): env.AutodetectUploadPort()
;         (espressif32/builder/main.py:157)
; Con cualquier valor puesto se lo pasa literal a esptool, que falla con
; «could not open». Dejarlo vacio es la unica via.
;
; Si alguna vez hay dos puentes USB-serie conectados a la vez, PlatformIO elige
; el ultimo con VID:PID y puede acertar el equivocado: ahi se usa
; `pio run -t upload --upload-port /dev/cu.wchusbserialNNNN` para esa corrida.

monitor_filters = esp32_exception_decoder

; COPIA MANUAL de ../platformio.ini. Ver el aviso del encabezado.
lib_deps = bodmer/TFT_eSPI@2.5.43

build_src_filter = +<display.cpp>

build_flags =
    ; nombreValido(), compartida con el marco y con el banco de red. La usa el
    ; recorrido de directorio para saltarse lo que no cumple el patrón y para
    ; calcular el reanclaje del contador. Ver ../src/nombre.h.
    -I../src
    ; Nivel WARN. Por defecto PlatformIO compila en ERROR, y toda la secuencia de
    ; init de la SD reporta sus fallos con log_w: sin esto, un CMD8 o un ACMD41
    ; que fallan se ven como un único «f_mount failed: (3)» que no dice en qué
    ; paso fue. Es un banco de diagnóstico; el ruido extra es el entregable.
    ; NO va en env:marco.
    -D CORE_DEBUG_LEVEL=3
    ; Driver, geometría, pines y fuentes, compartidos con env:marco. NO son
    ; copia manual, a propósito: ver ../tft_comun.ini. Si ese archivo falta,
    ; esta línea no resuelve y el build se cae — no hay compilar en silencio
    ; con otros pines, que es justo el fallo que arruinaría el pendiente #3.
    ${tft.build_flags}
    ; ── Aquí vive el pendiente #3. Editar, reflashear, anotar. 27 → 40 → 80 ──
    -D SPI_FREQUENCY=40000000
    ; Sin esta línea TFT_eSPI cae a 10 MHz por defecto (TFT_eSPI.h:126), no a
    ; SPI_FREQUENCY. Con TFT_MISO=-1 no se lee nada, pero se deja por paridad
    ; con el marco: este env tiene que compilar la misma configuración.
    -D SPI_READ_FREQUENCY=20000000
