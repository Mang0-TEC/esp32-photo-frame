; ══════════════════════════════════════════════════════════════════════
;  BANCO DE PRUEBAS — NO ES LA BASE DEL FIRMWARE REAL
;
;  El firmware del marco vive en ../platformio.ini, env:marco, con sus
;  siete dependencias. Este proyecto existe SOLO para desarrollar y medir
;  la capa de red de web/index.html (etapa 5) contra el ESP32 real, sin
;  display, sin SD y sin sensor. No usa ningún GPIO.
;
;  Las tres versiones de abajo son COPIA MANUAL de ../platformio.ini y se
;  sincronizan A MANO cuando aquél cambie. Si divergen, el banco deja de
;  probar lo que el firmware va a correr — que es el único motivo de que
;  este mock esté en el ESP32 y no en Python.
; ══════════════════════════════════════════════════════════════════════

[platformio]
data_dir = ../../web          ; uploadfs sirve web/index.html sin copiarlo

[env:mock]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32dev          ; sin esta línea: TypeError en setup_python_env
framework = arduino

monitor_speed = 115200
upload_port   = /dev/cu.usbserial-0001
monitor_port  = /dev/cu.usbserial-0001

board_build.filesystem = littlefs
; sin board_build.partitions: default.csv da 1.2 MB de app y ~1.5 MB de
; filesystem. huge_app.csv es de producción y aquí no hace falta.

lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

build_flags =
    ; Los dos buffers salen de un malloc de arranque, no de .bss: el enlazador
    ; solo da 74,392 B de dram0_0_seg y hacen falta 114,688. Un malloc único que
    ; nunca se libera ni se redimensiona tampoco fragmenta, que era el punto.
    ; Son flags y no constantes del .cpp para repetir la Fase 0 sin editar nada.
    -D BANCO_TOPE=65536            ; tope duro por archivo → 413. NO subirlo.
    -D BANCO_RET=49152             ; foto retenida que sirve /photo. Cubre con
                                   ; margen el peor caso medido (40.3 KB).
    -D BANCO_RETARDO_SD_MS=30
;   -D BANCO_CORS      ; ¡¡SOLO con la página servida desde otra máquina!!
