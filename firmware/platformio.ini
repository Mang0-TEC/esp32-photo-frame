[platformio]
; Los flags de TFT_eSPI son un invariante compartido con firmware/banco/,
; env:display: si los pines divergen, el banco prueba otro circuito y el
; pendiente #3 deja de transferirse al marco. Ver el encabezado de ese archivo.
extra_configs = tft_comun.ini

[env:marco]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32dev
framework = arduino

monitor_speed = 115200
board_build.partitions = huge_app.csv

; Gzipea web/index.html a src/pagina.h antes de compilar, para servirla desde
; PROGMEM. Es lo que hace imposible que el firmware y su página se desincronicen
; —una sola imagen que flashear— y por eso pagina.h va al .gitignore: se genera
; aquí. El script además falla el build si CFG.DIAG quedó en true.
extra_scripts = pre:tools/empaquetar_pagina.py

; SIN upload_port/monitor_port A PROPOSITO: asi PlatformIO autodetecta.
; El sufijo del tty es el LOCATION ID DEL USB (`USB Serial@01120000` ->
; wchusbserial1120), o sea que cambia al mover el cable de puerto o de hub y NO
; identifica a la placa. Un valor literal obliga a editar cinco bloques cada vez
; que se reenchufa, y eso ya paso.
;
; MEDIDO el 7-ago-2026, y el mecanismo NO es el que parece: un comodin tampoco
; sirve, pero no porque PlatformIO no sepa expandirlo —su AutodetectUploadPort()
; lo hace (builder/tools/pioupload.py:99)— sino porque el platform de Espressif
; solo LLAMA a esa funcion si el puerto esta vacio:
;     if not env.subst("$UPLOAD_PORT"): env.AutodetectUploadPort()
;         (espressif32/builder/main.py:157)
; Con cualquier valor puesto se lo pasa literal a esptool, que falla con
; «could not open». Dejarlo vacio es la unica via.
;
; Si alguna vez hay dos puentes USB-serie conectados a la vez, PlatformIO elige
; el ultimo con VID:PID y puede acertar el equivocado: ahi se usa
; `pio run -t upload --upload-port /dev/cu.wchusbserialNNNN` para esa corrida.

; Convierte el backtrace de direcciones de un Guru Meditation en archivo:línea.
; Puesto para la etapa 2 del pendiente #5, pero no hay razón para quitarlo.
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0
    claws/BH1750@1.3.0
    tzapu/WiFiManager@2.0.17
    ricmoo/QRCode@0.0.1
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

build_flags =
    ; --- WiFiManager: portal en español, por flag y NUNCA editando la librería ---
    ; Mismo patrón que USER_SETUP_LOADED de abajo, y por la misma razón: editar
    ; el archivo de la librería pierde la config al actualizar y al clonar.
    ; No se usa el wm_strings_es.h que trae la librería: está SIN TRADUCIR
    ; (contenido idéntico al inglés, encabezado «SAMPLE», versión 0.0.0).
    ; El -I src es lo que deja que WiFiManager.h resuelva el #include.
    -D WM_STRINGS_FILE='"wm_strings_marco.h"'
    -I src
    ; --- TFT_eSPI: config por flags, NUNCA editando User_Setup.h ---
    ; Driver, geometría, pines y fuentes viven en tft_comun.ini, compartidos con
    ; el banco del display. Si este archivo no aparece, la interpolación falla y
    ; el build se cae: no hay forma de compilar en silencio con otros pines.
    ${tft.build_flags}
    ; Las frecuencias NO son compartidas: SPI_FREQUENCY es la variable del
    ; pendiente #3 y el barrido del banco no debe tocar la del marco.
    ;
    ; 40 MHz es el resultado MEDIDO del pendiente #3 (cerrado 7-ago-2026), no un
    ; valor de arranque. Las tres frecuencias dieron imagen limpia y el bus escala
    ; al 97-99 % de su techo en las tres, así que la elección no es de velocidad:
    ; repintar una foto cuesta 77 ms aquí contra 45 a 80 MHz, y eso es invisible
    ; en un marco que cambia de imagen cada varios segundos. Se toma el escalón
    ; que duplica el margen sobre 27 sin acercarse al límite del cableado.
    -D SPI_FREQUENCY=40000000
    ; Sin esta línea TFT_eSPI cae a 10 MHz por defecto (TFT_eSPI.h:126), no a
    ; SPI_FREQUENCY. Con TFT_MISO=-1 no se lee nada, pero se deja por paridad.
    -D SPI_READ_FREQUENCY=20000000