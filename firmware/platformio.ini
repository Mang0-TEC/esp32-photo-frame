[platformio]
; Los flags de TFT_eSPI son un invariante compartido con firmware/banco/,
; env:display: si los pines divergen, el banco prueba otro circuito y el
; pendiente #3 deja de transferirse al marco. Ver el encabezado de ese archivo.
extra_configs = tft_comun.ini

[env:marco]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32dev
framework = arduino

monitor_speed = 115200
board_build.partitions = huge_app.csv

; Ruta literal, igual que en banco/platformio.ini. El nombre del tty lo pone el
; puente USB y cambia con la placa:
;   CH340  (USB-C, la de ahora) -> /dev/cu.wchusbserial1110
;   CP2102 (micro-USB, la vieja) -> /dev/cu.usbserial-0001
; Probado: un glob NO sirve — PlatformIO se lo pasa literal a esptool y falla
; con «no such file», aunque `pio device list` sí enumere el puerto.
upload_port   = /dev/cu.wchusbserial1110
monitor_port  = /dev/cu.wchusbserial1110

; Convierte el backtrace de direcciones de un Guru Meditation en archivo:línea.
; Puesto para la etapa 2 del pendiente #5, pero no hay razón para quitarlo.
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0
    claws/BH1750@1.3.0
    tzapu/WiFiManager@2.0.17
    ricmoo/QRCode@0.0.1
    ESP32Async/ESPAsyncWebServer@3.12.0
    ESP32Async/AsyncTCP@3.5.0

build_flags =
    ; --- WiFiManager: portal en español, por flag y NUNCA editando la librería ---
    ; Mismo patrón que USER_SETUP_LOADED de abajo, y por la misma razón: editar
    ; el archivo de la librería pierde la config al actualizar y al clonar.
    ; No se usa el wm_strings_es.h que trae la librería: está SIN TRADUCIR
    ; (contenido idéntico al inglés, encabezado «SAMPLE», versión 0.0.0).
    ; El -I src es lo que deja que WiFiManager.h resuelva el #include.
    -D WM_STRINGS_FILE='"wm_strings_marco.h"'
    -I src
    ; --- TFT_eSPI: config por flags, NUNCA editando User_Setup.h ---
    ; Driver, geometría, pines y fuentes viven en tft_comun.ini, compartidos con
    ; el banco del display. Si este archivo no aparece, la interpolación falla y
    ; el build se cae: no hay forma de compilar en silencio con otros pines.
    ${tft.build_flags}
    ; Las frecuencias NO son compartidas: SPI_FREQUENCY es la variable del
    ; pendiente #3 y el barrido del banco no debe tocar la del marco.
    -D SPI_FREQUENCY=27000000
    ; Sin esta línea TFT_eSPI cae a 10 MHz por defecto (TFT_eSPI.h:126), no a
    ; SPI_FREQUENCY. Con TFT_MISO=-1 no se lee nada, pero se deja por paridad.
    -D SPI_READ_FREQUENCY=20000000