; ══════════════════════════════════════════════════════════════════════
;  TFT_eSPI — configuración compartida por el marco y el banco del display
;
;  Lo incluyen ../firmware/platformio.ini (env:marco) y
;  firmware/banco/platformio.ini (env:display), los dos con `extra_configs`.
;
;  ── Por qué esto NO se copia a mano, al revés que lib_deps ─────────────
;
;  El banco duplica a mano la plataforma y las versiones de librerías, y se
;  acepta porque esa divergencia es DETECTABLE: otra versión es otro binario
;  y el encabezado de cada .ini lo avisa. Un pin de TFT divergente no: haría
;  que el banco probara OTRO CIRCUITO, en silencio, y todo el sentido del
;  pendiente #3 —la velocidad SPI máxima estable— es que su respuesta se
;  transfiera al marco. Si los pines no son los mismos, no se transfiere nada.
;
;  Tampoco hay caída silenciosa si este archivo falta: `${tft.build_flags}`
;  no resuelve y el build falla con error de interpolación. Es la misma
;  propiedad que este proyecto ya exige a WM_STRINGS_FILE.
;
;  ── Lo que deliberadamente NO está aquí ───────────────────────────────
;
;  SPI_FREQUENCY y SPI_READ_FREQUENCY viven en cada env, no aquí. La primera
;  es justo la variable del pendiente #3, y el barrido de tres binarios del
;  banco (27 → 40 → 80 MHz) no debe tocar la configuración del marco.
;
;  USE_HSPI_PORT sigue deliberadamente ausente: TFT_eSPI usa VSPI por
;  defecto, que es lo que se quiere, y el HSPI se asigna a la SD a mano.
;
;  Al tocar un pin de aquí, actualizar el mapa de GPIOs del BOM.
; ══════════════════════════════════════════════════════════════════════
[tft]
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=-1          ; SDA-0 sin conectar
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=17
    -D TFT_RST=16
    ; BL se controla aparte con LEDC — no declararlo aquí
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
